name: pipeline

# ⑤ AI画像販売, on a schedule, with nobody's computer switched on.
#
# Off until the owner switches it on: set the repository variable
# AIWORKER_PIPELINE to "on" once the secrets below are stored. Until then a
# scheduled run is skipped (shown grey), not failed (red).
#
# Logs are public on a public repository. The run prints one line of counts;
# keys reach the process as environment variables only, and GitHub masks
# them if anything ever echoed one.

on:
  schedule:
    # Every 3 hours, off the top of the hour when GitHub's queue is busiest.
    # Schedules only run on the default branch.
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never two runs at once: both would plan against the same daily budget.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    if: vars.AIWORKER_PIPELINE == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: pip install .

      - name: Run the pipeline
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          AIWORKER_OWNER_ID: ${{ vars.AIWORKER_OWNER_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python -m aiworker.cloud run
