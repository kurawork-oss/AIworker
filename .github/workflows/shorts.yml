name: shorts

# YouTubeショート: one video a day, made in the cloud. The owner watches it in
# the app, approves, and posts it from the YouTube app (API uploads from an
# unaudited project are forced private).
#
# Off until the owner sets the repository variable AIWORKER_SHORTS to "on".
# Logs are public: the run prints counts only.

on:
  schedule:
    - cron: "41 9 * * *"   # 18:41 JST
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shorts
  cancel-in-progress: false

jobs:
  run:
    if: vars.AIWORKER_SHORTS == 'on'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      # Japanese narration, free for commercial use with a credit line, which
      # the pipeline writes into every description.
      voicevox:
        image: voicevox/voicevox_engine:cpu-amd64-ubuntu22.04-0.25.2
        ports: ["50021:50021"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg and a Japanese font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-cjk

      - name: Install
        run: pip install .

      - name: Wait for the voice engine
        run: |
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:50021/version > /dev/null && exit 0
            sleep 3
          done
          echo "VOICEVOX did not start" && exit 1

      - name: Make today's Short
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          AIWORKER_OWNER_ID: ${{ vars.AIWORKER_OWNER_ID }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VOICEVOX_URL: http://127.0.0.1:50021
          VOICEVOX_SPEAKER: ${{ vars.VOICEVOX_SPEAKER || '3' }}
        run: python -m aiworker.cloud run --only youtube_shorts
