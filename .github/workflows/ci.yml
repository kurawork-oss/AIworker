name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A newer push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # All three verified locally before this workflow was written.
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  smoke:
    name: end-to-end against an installed package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Installing (rather than importing from src/) is the point: the unit
      # tests cannot catch a module or template left out of the distribution,
      # and both `init` and `checklist` have been broken that way before.
      - name: Install the package
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Walk the operator path
        run: ./scripts/smoke_test.sh

  hygiene:
    name: repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The secret scan is worth running over history, not just the tip:
          # `git rm` does not un-leak a key.
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PyYAML
        run: pip install PyYAML

      - name: No secrets, no state files, safe shipped defaults
        run: python3 scripts/check_repo_hygiene.py

  web:
    name: approval UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install with the web extra
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Every screen renders
        run: python3 scripts/check_web_ui.py
